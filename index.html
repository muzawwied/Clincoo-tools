<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Clincoo Tools</title>
<meta name="description" content="Kumpulan tools gratis dari Clincoo. Tanpa iklan, tanpa daftar, tanpa watermark.">
<!-- Favicon: logo Clincoo -->
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2048%2048'%3E%3Crect%20width='48'%20height='48'%20rx='13'%20fill='%23111'/%3E%3Cg%20transform='translate(7%207)%20scale(.708)'%20fill='%23fff'%3E%3Cpath%20d='M3%2022A19%2019%200%200%201%2022%203L22%2022Z'/%3E%3Cpath%20d='M22%2026L3%2026A19%2019%200%200%200%2022%2045Z'/%3E%3Ccircle%20cx='35.5'%20cy='12.5'%20r='9.5'/%3E%3Ccircle%20cx='35.5'%20cy='35.5'%20r='9.5'/%3E%3C/g%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Montserrat:wght@700;800&display=swap" rel="stylesheet">
<script>
(function () {
  try {
    var p = localStorage.getItem('clq_theme') || 'auto';
    var d = p === 'dark' || (p !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
    if (d) document.documentElement.classList.add('dark-mode');
  } catch (e) {}
})();
</script>
<script defer src="https://unpkg.com/@phosphor-icons/web"></script>
<style>
  :root { --bg:#fff; --fg:#111; --mut:#71717a; --card:#f4f4f5; --card2:#ececee; --line:#e5e7eb; --inv:#fff; --hov:#f4f4f6; --act:#e4e4e7; --sec:#9ca3af; }
  .dark-mode { --bg:#0e0e10; --fg:#f2f2f4; --mut:#8d8d96; --card:#202025; --card2:#2a2a30; --line:#2e2e34; --inv:#111; --hov:#222227; --act:#303037; --sec:#77777f; }
  * { box-sizing: border-box; margin: 0; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  a { color: inherit; text-decoration: none; }
  html, body { min-height: 100%; background: var(--bg); color: var(--fg); font-family: 'Inter', system-ui, sans-serif; -webkit-tap-highlight-color: transparent; }
  :focus { outline: none; }
  :focus-visible { outline: 2px solid #6366f1; outline-offset: 2px; }
  [hidden] { display: none !important; }


  main { max-width: 560px; margin: 0 auto; padding: calc(28px + env(safe-area-inset-top, 0px)) 16px calc(40px + env(safe-area-inset-bottom, 0px)); animation: vin .22s cubic-bezier(.2,.7,.2,1); }
  @keyframes vin { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

  /* Hero */
  .hero { display: grid; grid-template-columns: auto 1fr; align-items: center; column-gap: 14px; text-align: left; padding: 4px 4px 0; }
  /* Logo Clincoo: SVG memakai currentColor, otomatis ikut tema terang/gelap */
  .logo { display: block; width: 46px; height: 46px; color: var(--fg); }
  .logo svg { width: 100%; height: 100%; display: block; }
  .hero h1 { font-family: 'Montserrat', sans-serif; font-size: 26px; font-weight: 800; letter-spacing: -.03em; line-height: 1.15; }
  .hero p { grid-column: 1 / -1; margin-top: 16px; font-size: 14.5px; line-height: 1.5; color: var(--mut); text-wrap: pretty; }

  .perks { grid-column: 1 / -1; display: flex; flex-wrap: wrap; justify-content: flex-start; gap: 8px; margin: 14px 0 0; }
  .perk { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 13px; border-radius: 9999px; background: var(--card); font-size: 12.5px; font-weight: 500; }
  .perk i { font-size: 15px; color: var(--mut); }

  /* Cari */
  .search { position: relative; margin-top: 24px; }
  .search i { position: absolute; left: 17px; top: 50%; transform: translateY(-50%); font-size: 18px; color: var(--mut); pointer-events: none; }
  .search input { width: 100%; height: 48px; padding: 0 16px 0 46px; border: 1px solid transparent; border-radius: 9999px; background: var(--card); color: var(--fg); font: inherit; font-size: 15px; outline: none; -webkit-appearance: none; appearance: none; transition: border-color .15s, background-color .15s; }
  .search input::placeholder { color: var(--mut); }
  .search input:focus { border-color: var(--mut); background: var(--bg); }

  /* Chip filter */
  .chips { display: flex; gap: 8px; margin: 12px -16px 0; padding: 0 16px 2px; overflow-x: auto; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { flex: none; height: 34px; padding: 0 15px; border-radius: 9999px; background: var(--card); color: var(--fg); font-size: 13.5px; font-weight: 500; white-space: nowrap; transition: background-color .15s, color .15s, transform .12s; }
  .chip:hover { background: var(--card2); }
  .chip:active { transform: scale(.97); }
  .chip.on { background: var(--fg); color: var(--inv); }

  .sec { margin: 32px 6px 10px; font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--sec); }

  /* Kartu bergrup: sudut luar besar, sudut dalam kecil */
  .card { display: flex; flex-direction: column; gap: 3px; }
  .it { display: flex; align-items: center; gap: 14px; width: 100%; min-height: 66px; padding: 10px 16px; border-radius: 6px; background: var(--card); color: var(--fg); text-align: left; transition: background-color .15s, transform .12s; }
  .it:first-child { border-top-left-radius: 22px; border-top-right-radius: 22px; }
  .it:last-child { border-bottom-left-radius: 22px; border-bottom-right-radius: 22px; }
  a.it:hover { background: var(--card2); }
  a.it:active { background: var(--act); transform: scale(.99); }
  .it-i { flex: none; display: flex; align-items: center; justify-content: center; width: 26px; font-size: 24px; color: var(--mut); }
  a.it:hover .it-i { color: var(--fg); }
  .it-w { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .it-t { font-size: 15.5px; font-weight: 500; line-height: 1.3; overflow-wrap: anywhere; }
  .it-s { font-size: 13px; line-height: 1.35; color: var(--mut); overflow-wrap: anywhere; }
  .go { flex: none; font-size: 18px; color: var(--mut); transition: transform .15s; }
  a.it:hover .go { transform: translateX(2px); color: var(--fg); }
  .badge { flex: none; padding: 2px 9px; border-radius: 9999px; background: var(--card2); color: var(--mut); font-size: 11.5px; font-weight: 500; }
  .it.soon { cursor: default; }
  .it.soon .it-t { color: var(--mut); }
  .it.soon .it-i { opacity: .6; }

  .empty { display: flex; flex-direction: column; align-items: center; text-align: center; padding: 44px 20px; }
  .empty > i { font-size: 40px; color: var(--mut); margin-bottom: 12px; }
  .empty h2 { font-family: 'Montserrat', sans-serif; font-size: 18px; font-weight: 700; letter-spacing: -.01em; }
  .empty p { margin-top: 6px; max-width: 280px; font-size: 14px; line-height: 1.5; color: var(--mut); }


  @media (prefers-reduced-motion: reduce) { main { animation: none; } .it, .go { transition: none; } }
</style>
</head>
<body>

<main>
  <section class="hero">
    <div class="logo" id="logo" role="img" aria-label="Logo Clincoo">
      <svg viewBox="0 0 48 48" fill="currentColor" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M3 22A19 19 0 0 1 22 3L22 22Z"/>
        <path d="M22 26L3 26A19 19 0 0 0 22 45Z"/>
        <circle cx="35.5" cy="12.5" r="9.5"/>
        <circle cx="35.5" cy="35.5" r="9.5"/>
      </svg>
    </div>
    <h1>Clincoo Tools</h1>
    <p>Kumpulan tools gratis untuk pekerjaan sehari-hari.</p>
    <div class="perks">
      <span class="perk"><i class="ph ph-prohibit"></i>Tanpa iklan</span>
      <span class="perk"><i class="ph ph-user-minus"></i>Tanpa daftar</span>
      <span class="perk"><i class="ph ph-drop"></i>Tanpa watermark</span>
    </div>
  </section>

  <div class="search"><i class="ph ph-magnifying-glass"></i><input id="q" type="search" placeholder="Cari tools" aria-label="Cari tools" autocomplete="off"></div>

  <div class="chips" id="chips" role="tablist" aria-label="Filter kategori"></div>

  <div id="list"></div>

</main>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var esc = function (t) { return String(t == null ? '' : t).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };

  /* ====== DAFTAR TOOLS ======
     Tambah tool baru: salin satu baris, ganti isinya.
     ico  : nama ikon Phosphor (https://phosphoricons.com)
     cat  : kategori; chip filter dibuat otomatis dari nilai ini
     href : link tool; kosongkan dan set soon:true bila belum rilis */
  var TOOLS = [
    { name: 'Clincoo QR',      cat: 'Umum', desc: 'Buat QR code untuk link, WhatsApp, dan Wi-Fi', ico: 'ph-qr-code',       href: '/tools/qr' },
    { name: 'Clincoo Invoice', cat: 'Keuangan',  desc: 'Generator invoice dan kwitansi',               ico: 'ph-receipt',       href: '/tools/invoice' },
    { name: 'Clincoo WA Link', cat: 'Umum', desc: 'Link WhatsApp dengan pesan otomatis',          ico: 'ph-whatsapp-logo', href: '/tools/wa' },
    { name: 'Clincoo Hitung',  cat: 'Keuangan',  desc: 'Kalkulator THR, PPh 21, dan cicilan',          ico: 'ph-calculator',    href: '/tools/hitung' }
  ];
  var CATS = ['Semua'];
  TOOLS.forEach(function (t) { if (t.cat && CATS.indexOf(t.cat) < 0) CATS.push(t.cat); });
  var cat = 'Semua';

  /* Tema: ikut pengaturan clq_theme (sama dengan halaman lain) atau sistem */
  var mq = matchMedia('(prefers-color-scheme: dark)');
  function pref() { try { return localStorage.getItem('clq_theme') || 'auto'; } catch (e) { return 'auto'; } }
  function isDark() { var p = pref(); return p === 'dark' || (p !== 'light' && mq.matches); }
  function theme() {
    var d = isDark();
    document.documentElement.classList.toggle('dark-mode', d);
    document.querySelector('meta[name=theme-color]').content = d ? '#0e0e10' : '#ffffff';
  }
  theme(); mq.addEventListener('change', theme);
  addEventListener('storage', function (e) { if (e.key === 'clq_theme') theme(); });

  /* Daftar */
  function row(t) {
    var body = '<i class="ph ' + esc(t.ico) + ' it-i"></i>'
      + '<span class="it-w"><span class="it-t">' + esc(t.name) + '</span><span class="it-s">' + esc(t.desc) + '</span></span>';
    if (t.soon || !t.href) return '<div class="it soon">' + body + '<span class="badge">Segera</span></div>';
    return '<a class="it" href="' + esc(t.href) + '">' + body + '<i class="ph ph-caret-right go"></i></a>';
  }
  function draw() {
    var q = $('q').value.trim().toLowerCase();
    var rows = TOOLS.filter(function (t) {
      return (cat === 'Semua' || t.cat === cat) && (!q || (t.name + ' ' + t.desc).toLowerCase().indexOf(q) > -1);
    });
    var out = '';
    if (rows.length) out += '<div class="card" style="margin-top:20px">' + rows.map(row).join('') + '</div>';
    if (!rows.length) out = '<div class="empty"><i class="ph ph-magnifying-glass"></i><h2>Tidak ditemukan</h2><p>Tidak ada tool yang cocok dengan pencarianmu.</p></div>';
    $('list').innerHTML = out;
  }
  function drawChips() {
    $('chips').innerHTML = CATS.map(function (c) {
      return '<button type="button" class="chip' + (c === cat ? ' on' : '') + '" role="tab" aria-selected="' + (c === cat) + '" data-c="' + esc(c) + '">' + esc(c) + '</button>';
    }).join('');
  }
  $('chips').onclick = function (e) {
    var b = e.target.closest('.chip');
    if (!b) return;
    cat = b.getAttribute('data-c');
    drawChips(); draw();
  };
  $('q').oninput = draw;
  drawChips();
  draw();
})();
</script>
</body>
</html>

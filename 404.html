<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="robots" content="noindex">
<title>Halaman tidak ditemukan — Clincoo Tools</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2048%2048'%3E%3Crect%20width='48'%20height='48'%20rx='13'%20fill='%23111'/%3E%3Cg%20transform='translate(7%207)%20scale(.708)'%20fill='%23fff'%3E%3Cpath%20d='M3%2022A19%2019%200%200%201%2022%203L22%2022Z'/%3E%3Cpath%20d='M22%2026L3%2026A19%2019%200%200%200%2022%2045Z'/%3E%3Ccircle%20cx='35.5'%20cy='12.5'%20r='9.5'/%3E%3Ccircle%20cx='35.5'%20cy='35.5'%20r='9.5'/%3E%3C/g%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Montserrat:wght@700;800&display=swap" rel="stylesheet">
<script>
(function () {
  try {
    var p = localStorage.getItem('clq_theme') || 'auto';
    var d = p === 'dark' || (p !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
    if (d) document.documentElement.classList.add('dark-mode');
    document.documentElement.style.colorScheme = d ? 'dark' : 'light';
    var m = document.querySelector('meta[name=theme-color]'); if (m) m.content = d ? '#0e0e10' : '#ffffff';
  } catch (e) {}
})();
</script>
<style>
  :root { --bg:#fff; --fg:#111; --mut:#71717a; --card:#f4f4f5; --card2:#ececee; --line:#e5e7eb; --inv:#fff; --act:#e4e4e7;
          --glow-a:rgba(99,102,241,.10); --glow-b:rgba(236,72,153,.08); --glow-c:rgba(14,165,233,.07); }
  .dark-mode { --bg:#0e0e10; --fg:#f2f2f4; --mut:#8d8d96; --card:#202025; --card2:#2a2a30; --line:#2e2e34; --inv:#111; --act:#303037;
          --glow-a:rgba(99,102,241,.16); --glow-b:rgba(236,72,153,.10); --glow-c:rgba(14,165,233,.09); }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  a { color: inherit; text-decoration: none; }
  :focus { outline: none; }
  :focus-visible { outline: 2px solid #6366f1; outline-offset: 2px; }
  html, body { min-height: 100%; }
  body {
    min-height: 100dvh; display: flex; align-items: center; justify-content: center;
    padding: calc(24px + env(safe-area-inset-top, 0px)) 16px calc(24px + env(safe-area-inset-bottom, 0px));
    font-family: 'Inter', system-ui, sans-serif; background: var(--bg); color: var(--fg);
    -webkit-tap-highlight-color: transparent;
  }
  body::before {
    content: ""; position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background:
      radial-gradient(620px 400px at 90% -8%, var(--glow-a), transparent 62%),
      radial-gradient(700px 430px at 6% -12%, var(--glow-b), transparent 62%),
      radial-gradient(820px 520px at 50% 112%, var(--glow-c), transparent 62%);
  }
  .wrap { position: relative; z-index: 1; width: 100%; max-width: 28rem; display: flex; flex-direction: column; align-items: center; text-align: center; }

  /* 4 [logo] 4 */
  .code { display: flex; align-items: center; justify-content: center; gap: clamp(2px, 1.5vw, 8px); height: clamp(100px, 30vw, 150px); margin-bottom: 18px; }
  .code .d { font-family: 'Montserrat', sans-serif; font-weight: 800; font-size: clamp(5rem, 24vw, 8.5rem); letter-spacing: -.05em; line-height: 1; display: inline-block; animation: float 4.5s ease-in-out infinite; }
  .code .d:last-child { animation-delay: -2.2s; }
  .mark { width: clamp(76px, 23vw, 116px); height: clamp(76px, 23vw, 116px); color: var(--fg); animation: float 4.5s ease-in-out infinite; animation-delay: -1.1s; overflow: visible; }
  .mark .a, .mark .b { transform-box: fill-box; }
  .mark .a { animation: slideL .9s cubic-bezier(.2,.8,.2,1) .15s both; }
  .mark .b { animation: slideL .9s cubic-bezier(.2,.8,.2,1) .25s both; }
  .mark .c1 { transform-box: fill-box; transform-origin: center; animation: pop .6s cubic-bezier(.3,1.6,.5,1) .55s both, bob 3.2s ease-in-out 1.4s infinite; }
  .mark .c2 { transform-box: fill-box; transform-origin: center; animation: pop .6s cubic-bezier(.3,1.6,.5,1) .7s both, bob 3.2s ease-in-out 1.9s infinite reverse; }

  h1 { font-family: 'Montserrat', sans-serif; font-size: clamp(1.4rem, 5.4vw, 1.8rem); font-weight: 800; letter-spacing: -.03em; line-height: 1.2; text-wrap: balance; }
  .sub { margin-top: 10px; max-width: 24rem; font-size: 15px; line-height: 1.6; color: var(--mut); text-wrap: pretty; }

  .reveal { opacity: 0; transform: translateY(10px); animation: rise .6s cubic-bezier(.2,.8,.2,1) forwards; }
  .r1 { animation-delay: .05s; } .r2 { animation-delay: .2s; } .r3 { animation-delay: .3s; }

  @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
  @keyframes rise { to { opacity: 1; transform: none; } }
  @keyframes slideL { from { opacity: 0; transform: translateX(-14px); } to { opacity: 1; transform: none; } }
  @keyframes pop { from { opacity: 0; transform: scale(.2); } to { opacity: 1; transform: scale(1); } }
  @keyframes bob { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.12); } }
  @media (prefers-reduced-motion: reduce) {
    .code .d, .mark, .mark *, .reveal { animation: none !important; transition: none !important; opacity: 1; transform: none; }
  }
</style>
</head>
<body>
<main class="wrap">
  <div class="code reveal r1" aria-hidden="true">
    <span class="d">4</span>
    <svg class="mark" viewBox="0 0 48 48" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
      <path class="a" d="M3 22A19 19 0 0 1 22 3L22 22Z"/>
      <path class="b" d="M22 26L3 26A19 19 0 0 0 22 45Z"/>
      <circle class="c1" cx="35.5" cy="12.5" r="9.5"/>
      <circle class="c2" cx="35.5" cy="35.5" r="9.5"/>
    </svg>
    <span class="d">4</span>
  </div>

  <h1 class="reveal r2">Halaman tidak ditemukan</h1>
  <p class="sub reveal r3">Alamat yang kamu buka tidak ada, atau tool-nya sudah dipindahkan.</p>
</main>
</body>
</html>
